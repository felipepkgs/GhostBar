<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stack">
    <div class="row">
      <div class="bar" id="barFKeys">
        <div class="seg">F1</div>
        <div class="seg">F2</div>
        <div class="seg">F3</div>
        <div class="seg">F4</div>
        <div class="seg">F5</div>
        <div class="seg">F6</div>
        <div class="seg">F7</div>
        <div class="seg">F8</div>
        <div class="seg">F9</div>
        <div class="seg">F10</div>
        <div class="seg">F11</div>
        <div class="seg">F12</div>
        <div class="dot"></div>
      </div>
      <div class="row-label">Function Keys</div>
    </div>
    <div class="row">
      <div class="bar" id="barControl">
        <div class="seg">🔅</div>
        <div class="seg">🔆</div>
        <div class="seg">🖥</div>
        <div class="seg">🔍</div>
        <div class="seg">🎙</div>
        <div class="seg">🌙</div>
        <div class="seg">🔉</div>
        <div class="seg">🔇</div>
        <div class="seg">🔊</div>
        <div class="dot"></div>
      </div>
      <div class="row-label">Control Strip (default, may be customized)</div>
    </div>
    <div id="action"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
