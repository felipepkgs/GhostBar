<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stack">
    <div class="row">
      <div class="bar" id="barFKeys">
        <div class="seg">F1</div>
        <div class="seg">F2</div>
        <div class="seg">F3</div>
        <div class="seg">F4</div>
        <div class="seg">F5</div>
        <div class="seg">F6</div>
        <div class="seg">F7</div>
        <div class="seg">F8</div>
        <div class="seg">F9</div>
        <div class="seg">F10</div>
        <div class="seg">F11</div>
        <div class="seg">F12</div>
        <div class="dot"></div>
      </div>
      <div class="row-label">Function Keys</div>
    </div>
    <div class="row">
      <!-- Group positions/widths measured pixel-for-pixel from a reference
           screenshot of the real default Control Strip (see 2.png in the
           conversation) — not evenly distributed, so each is placed at its
           own absolute left/width rather than left to flexbox. -->
      <div class="bar grouped" id="barControl">
        <div class="group" style="left: 0.70%; width: 13.95%">
          <div class="seg">🔅</div>
          <div class="seg">🔆</div>
        </div>
        <div class="group" style="left: 16.05%; width: 7.20%">
          <div class="seg">🖥</div>
        </div>
        <div class="group" style="left: 24.80%; width: 7.05%">
          <div class="seg">▦</div>
        </div>
        <div class="group" style="left: 33.40%; width: 13.85%">
          <div class="seg">⌨−</div>
          <div class="seg">⌨+</div>
        </div>
        <div class="group" style="left: 48.85%; width: 20.20%">
          <div class="seg">⏪</div>
          <div class="seg">⏯</div>
          <div class="seg">⏩</div>
        </div>
        <div class="group" style="left: 70.50%; width: 20.25%">
          <div class="seg">🔇</div>
          <div class="seg">🔉</div>
          <div class="seg">🔊</div>
        </div>
        <div class="group" style="left: 92.20%; width: 7.20%">
          <div class="seg">✨</div>
        </div>
        <div class="dot"></div>
      </div>
      <div class="row-label">Control Strip (default, may be customized)</div>
    </div>
    <div id="action"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
